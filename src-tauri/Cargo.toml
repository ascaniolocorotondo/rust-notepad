[package]
name = "rust-notepad"
version = "0.1.0"
description = "Blocco note con blocchi di codice, esecuzione e assistente IA"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
trash = "5"

[profile.release]
strip = true
lto = true
